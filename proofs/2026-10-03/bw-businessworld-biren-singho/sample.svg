<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">BW Businessworld registration form repair sample</title>
  <desc id="desc">Local before and after proof showing the current missing registration form error and a restored registration form concept.</desc>
  <rect width="1600" height="900" fill="#f5f6f8"/>
  <text x="100" y="90" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#6b7280">LOCAL PROOF OF WORK · NOT DEPLOYED CLIENT WORK</text>
  <text x="100" y="150" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" fill="#111827">Restore the 2026 event registration path</text>
  <text x="100" y="192" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5b6470">Verified live WordPress before state and a bounded US$39 repair sample.</text>

  <rect x="100" y="250" width="660" height="490" rx="26" fill="#ffffff" stroke="#d9dde3" stroke-width="2"/>
  <text x="145" y="305" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#687383">BEFORE · VERIFIED LIVE STATE</text>
  <text x="145" y="365" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#111827">Registration</text>
  <text x="145" y="410" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#606b78">The current event page reaches the intended block,</text>
  <text x="145" y="440" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#606b78">but the form instance does not render.</text>
  <rect x="145" y="490" width="570" height="86" rx="14" fill="#fff2f0" stroke="#e5b3ad" stroke-width="2"/>
  <text x="175" y="542" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800" fill="#8f332b">Error: Contact form not found.</text>

  <rect x="840" y="250" width="660" height="490" rx="26" fill="#ffffff" stroke="#d9dde3" stroke-width="2"/>
  <text x="885" y="305" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#687383">AFTER · LOCAL REPAIR SAMPLE</text>
  <text x="885" y="365" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#111827">Registration</text>
  <rect x="885" y="405" width="265" height="50" rx="9" fill="#ffffff" stroke="#bcc4ce" stroke-width="2"/>
  <text x="905" y="437" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#737d89">Name</text>
  <rect x="1170" y="405" width="285" height="50" rx="9" fill="#ffffff" stroke="#bcc4ce" stroke-width="2"/>
  <text x="1190" y="437" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#737d89">Business email</text>
  <rect x="885" y="475" width="570" height="50" rx="9" fill="#ffffff" stroke="#bcc4ce" stroke-width="2"/>
  <text x="905" y="507" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#737d89">Registration type · Nomination</text>
  <rect x="885" y="545" width="570" height="78" rx="9" fill="#ffffff" stroke="#bcc4ce" stroke-width="2"/>
  <text x="905" y="580" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#737d89">Message</text>
  <rect x="885" y="645" width="235" height="54" rx="9" fill="#191d2a"/>
  <text x="912" y="680" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Continue registration</text>

  <rect x="100" y="785" width="1400" height="70" rx="18" fill="#171b26"/>
  <text x="135" y="829" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">US$39 scope: reconnect the approved form, preserve current event content and named contacts, verify required fields plus desktop/mobile.</text>
</svg>
