<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Luna Salon booking CTA local repair proof</title>
  <desc id="desc">Original before and after diagram showing a booking button that loops to the homepage before repair and routes to the existing booking flow after repair.</desc>
  <rect width="1200" height="630" fill="#f7f4f1"/>
  <text x="70" y="72" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#7c6f68">LOCAL PROOF OF WORK</text>
  <text x="70" y="132" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#231f20">Booking CTA route repair</text>
  <text x="70" y="174" font-family="Arial, sans-serif" font-size="22" fill="#766d69">Luna Salon Hair &amp; Day Spa</text>
  <rect x="70" y="220" width="500" height="260" rx="24" fill="#ffffff" stroke="#ded5d0"/>
  <text x="105" y="265" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#82766f">BEFORE, VERIFIED LIVE STATE</text>
  <text x="105" y="320" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#231f20">Book an Appointment</text>
  <rect x="105" y="357" width="390" height="40" rx="10" fill="#fff0ed"/>
  <text x="120" y="383" font-family="Courier New, monospace" font-size="15" font-weight="700" fill="#973e32">target: lunasalons.com homepage</text>
  <text x="105" y="435" font-family="Arial, sans-serif" font-size="17" fill="#766d69">Click returns to the same page.</text>
  <rect x="630" y="220" width="500" height="260" rx="24" fill="#ffffff" stroke="#ded5d0"/>
  <text x="665" y="265" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#82766f">AFTER, LOCAL REPAIR SAMPLE</text>
  <text x="665" y="320" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#231f20">Book an Appointment</text>
  <rect x="665" y="357" width="405" height="40" rx="10" fill="#edf8ef"/>
  <text x="680" y="383" font-family="Courier New, monospace" font-size="15" font-weight="700" fill="#2f6741">target: existing Katie booking flow</text>
  <text x="665" y="435" font-family="Arial, sans-serif" font-size="17" fill="#766d69">Existing Square destination stays in use.</text>
  <text x="70" y="550" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#231f20">NOT DEPLOYED CLIENT WORK</text>
  <text x="70" y="582" font-family="Arial, sans-serif" font-size="17" fill="#766d69">Original local demonstration. No live booking, site, or customer data was changed.</text>
</svg>
