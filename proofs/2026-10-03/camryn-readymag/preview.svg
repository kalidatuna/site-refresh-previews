<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020">
  <rect width="1440" height="1020" fill="#f5efdf"/>
  <line x1="120" y1="62" x2="1320" y2="62" stroke="#25262d" stroke-opacity=".25"/>
  <text x="120" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.4" fill="#25262d">CAMRYN TEDER</text>
  <text x="1180" y="40" font-family="Arial, sans-serif" font-size="12" letter-spacing="2" fill="#25262d">WRITING</text>
  <text x="1274" y="40" font-family="Arial, sans-serif" font-size="12" letter-spacing="2" fill="#25262d">ABOUT</text>
  <circle cx="1260" cy="115" r="88" fill="#d9a3aa" fill-opacity=".58"/>
  <ellipse cx="1175" cy="122" rx="62" ry="31" fill="none" stroke="#9caf88" stroke-width="3" transform="rotate(-8 1175 122)"/>

  <text x="120" y="150" font-family="Arial, sans-serif" font-size="12" letter-spacing="3" fill="#25262d">FOOD &amp; BEVERAGE · MUSIC · TRAVEL</text>
  <text x="120" y="270" font-family="Georgia, serif" font-size="100" fill="#25262d">Stories with a</text>
  <text x="190" y="365" font-family="Georgia, serif" font-size="102" font-style="italic" fill="#7589a6">sense of place.</text>

  <line x1="930" y1="310" x2="1320" y2="310" stroke="#25262d"/>
  <text x="930" y="352" font-family="Georgia, serif" font-size="20" fill="#25262d">An editorial portfolio direction built around</text>
  <text x="930" y="382" font-family="Georgia, serif" font-size="20" fill="#25262d">strong type, soft color, tactile details and</text>
  <text x="930" y="412" font-family="Georgia, serif" font-size="20" fill="#25262d">room for the writing to stay central.</text>

  <line x1="120" y1="510" x2="1320" y2="510" stroke="#25262d" stroke-opacity=".2"/>
  <text x="120" y="550" font-family="Arial, sans-serif" font-size="12" letter-spacing="2" fill="#25262d">SELECTED WRITING</text>
  <text x="1250" y="550" font-family="Arial, sans-serif" font-size="12" letter-spacing="2" fill="#25262d">01 — 03</text>

  <g transform="translate(120 585)">
    <rect width="370" height="255" fill="none" stroke="#25262d" stroke-opacity=".28"/>
    <text x="24" y="34" font-family="Arial, sans-serif" font-size="11" letter-spacing="2" fill="#25262d">FOOD &amp; BEVERAGE</text>
    <text x="24" y="126" font-family="Georgia, serif" font-size="40" fill="#25262d">Table notes,</text>
    <text x="24" y="168" font-family="Georgia, serif" font-size="40" fill="#25262d">people, places.</text>
    <text x="24" y="224" font-family="Arial, sans-serif" font-size="11" letter-spacing="2" fill="#25262d">OPEN STORY ↗</text>
    <circle cx="350" cy="260" r="62" fill="#d9a3aa" fill-opacity=".72"/>
  </g>
  <g transform="translate(510 585)">
    <rect width="370" height="255" fill="none" stroke="#25262d" stroke-opacity=".28"/>
    <text x="24" y="34" font-family="Arial, sans-serif" font-size="11" letter-spacing="2" fill="#25262d">MUSIC</text>
    <text x="24" y="126" font-family="Georgia, serif" font-size="40" fill="#25262d">Artists, records,</text>
    <text x="24" y="168" font-family="Georgia, serif" font-size="40" fill="#25262d">live rooms.</text>
    <text x="24" y="224" font-family="Arial, sans-serif" font-size="11" letter-spacing="2" fill="#25262d">OPEN STORY ↗</text>
    <circle cx="350" cy="260" r="62" fill="#7589a6" fill-opacity=".72"/>
  </g>
  <g transform="translate(900 585)">
    <rect width="370" height="255" fill="none" stroke="#25262d" stroke-opacity=".28"/>
    <text x="24" y="34" font-family="Arial, sans-serif" font-size="11" letter-spacing="2" fill="#25262d">TRAVEL</text>
    <text x="24" y="126" font-family="Georgia, serif" font-size="40" fill="#25262d">Dispatches from</text>
    <text x="24" y="168" font-family="Georgia, serif" font-size="40" fill="#25262d">elsewhere.</text>
    <text x="24" y="224" font-family="Arial, sans-serif" font-size="11" letter-spacing="2" fill="#25262d">OPEN STORY ↗</text>
    <circle cx="350" cy="260" r="62" fill="#9caf88" fill-opacity=".78"/>
  </g>

  <g transform="translate(735 865) rotate(1)">
    <rect width="535" height="70" fill="#fbf7ed"/>
    <text x="20" y="29" font-family="Georgia, serif" font-size="15" fill="#25262d">A small visual first slice based on your public brief.</text>
    <text x="20" y="52" font-family="Georgia, serif" font-size="15" fill="#25262d">Soft color, editorial rhythm, subtle interaction, writing first.</text>
  </g>
  <line x1="120" y1="966" x2="1320" y2="966" stroke="#25262d" stroke-opacity=".2"/>
  <text x="120" y="995" font-family="Arial, sans-serif" font-size="10" letter-spacing="2" fill="#25262d">EDITORIAL PORTFOLIO CONCEPT</text>
  <text x="1120" y="995" font-family="Arial, sans-serif" font-size="10" letter-spacing="2" fill="#25262d">RESPONSIVE FIRST SLICE</text>
</svg>
